name: Update chlorophyll map

on:
  schedule:
    # Tous les jours à 06:00 UTC — ajuste l'heure si besoin
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  update-chlorophyll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install copernicusmarine xarray matplotlib netCDF4

      - name: Generate chlorophyll image
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/generate_chlorophyll_image.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chlorophyll/
          git diff --staged --quiet || git commit -m "Mise à jour automatique de la carte chlorophylle"
          git push
